services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-brigitta}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-brigitta}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-brigitta} -d ${POSTGRES_DB:-brigitta}"]
      interval: 10s
      timeout: 5s
      retries: 10

  migrate:
    build:
      context: .
      target: builder
    env_file:
      - .env
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://${POSTGRES_USER:-brigitta}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-brigitta}
    command: ["npm", "run", "payload", "--", "migrate"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  app:
    build:
      context: .
      target: runner
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: 0.0.0.0
      DATABASE_URL: postgres://${POSTGRES_USER:-brigitta}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-brigitta}
    ports:
      - "${APP_PORT:-3000}:3000"
    volumes:
      - media_data:/app/public/media
    depends_on:
      migrate:
        condition: service_completed_successfully

volumes:
  postgres_data:
  media_data:
