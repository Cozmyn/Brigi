name: CI
on:
  pull_request:
  push:
    branches: [main]
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      matrix:
        database: ['mariadb:10.11', 'mysql:8.0']
    services:
      database:
        image: ${{ matrix.database }}
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: 'yes'
          MYSQL_ROOT_HOST: '%'
          MYSQL_DATABASE: brigitta_test
        ports: ['127.0.0.1:3306:3306']
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 --silent" --health-interval 10s
          --health-timeout 5s --health-retries 5
    env:
      DB_HOST: 127.0.0.1
      DB_PORT: '3306'
      DB_NAME: brigitta_test
      DB_USER: root
      DB_PASSWORD: ''
      INQUIRY_RATE_LIMIT_PER_HOUR: '100'
      SITE_URL: http://127.0.0.1:3000
      NEXT_PUBLIC_SERVER_URL: http://127.0.0.1:3000
      PRODUCTION_GATES_CLOSED: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm }
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:int
      - run: npm run db:migrate
      - run: npm run test:import
      - run: npm run test:db
      - run: npm run seed:content
        timeout-minutes: 3
      - run: npm run seed:content
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-qa-${{ strategy.job-index }}
          path: |
            playwright-report/
            test-results/
          retention-days: 7
