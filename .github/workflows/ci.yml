name: CI
on:
  pull_request:
  push:
    branches: [main]
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        database: ['mariadb:10.11', 'mysql:8.0']
    services:
      database:
        image: ${{ matrix.database }}
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: 'yes'
          MYSQL_ROOT_HOST: '%'
          MYSQL_DATABASE: brigitta_test
        ports: ['127.0.0.1:3306:3306']
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 --silent" --health-interval 10s
          --health-timeout 5s --health-retries 5
    env:
      DB_HOST: 127.0.0.1
      DB_PORT: '3306'
      DB_NAME: brigitta_test
      DB_USER: root
      DB_PASSWORD: ''
      INQUIRY_RATE_LIMIT_PER_HOUR: '100'
      SITE_URL: http://127.0.0.1:3000
      NEXT_PUBLIC_SERVER_URL: http://127.0.0.1:3000
      PRODUCTION_GATES_CLOSED: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm }
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:int
      - run: npm run db:migrate
      - run: npm run test:import
      - run: npm run test:db
      - run: npm run seed:content
        timeout-minutes: 3
      - run: npm run seed:content
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-qa-${{ strategy.job-index }}
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  report-ci:
    name: Report CI stages
    needs: verify
    if: ${{ always() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      pull-requests: write
    steps:
      - name: Publish stage outcomes without raw logs
        uses: actions/github-script@v7
        with:
          script: |
            const jobs = await github.paginate(github.rest.actions.listJobsForWorkflowRun, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: context.runId,
              filter: 'latest',
              per_page: 100,
            });
            const verifyJobs = jobs.filter(job => job.name.startsWith('verify ('));
            if (!verifyJobs.length) throw new Error('No verification jobs found for this run.');
            const lines = [
              '## CI stage report',
              'Run: ' + context.runId,
              'Head commit: ' + context.payload.pull_request.head.sha,
              'Only job and step outcomes are included; no raw logs or environment values.',
              '',
            ];
            for (const job of verifyJobs) {
              lines.push('### ' + job.name + ': ' + (job.conclusion || job.status));
              const failed = (job.steps || []).filter(step =>
                ['failure', 'cancelled', 'timed_out', 'action_required'].includes(step.conclusion)
              );
              if (failed.length) {
                for (const step of failed) lines.push('- Step ' + step.number + ': ' + step.name + ' — ' + step.conclusion);
              } else {
                lines.push('- No failed step reported by the Jobs API.');
              }
              lines.push('- Details: ' + job.html_url, '');
            }
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: lines.join('\n'),
            });
