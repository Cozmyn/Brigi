name: Import verified local fonts
on:
  push:
    branches: [fix/step-1-technical-foundation]
    paths:
      - '.github/workflows/vendor-local-fonts.yml'
      - 'scripts/vendor-local-fonts.mjs'
permissions:
  contents: write
concurrency:
  group: import-local-fonts
  cancel-in-progress: false
jobs:
  import-fonts:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Download immutable sources and verify hashes and Romanian glyphs
        run: node scripts/vendor-local-fonts.mjs
      - name: Commit only verified font assets and licenses to the existing branch
        run: |
          git add -- src/assets/fonts/BodoniModa-normal.ttf src/assets/fonts/BodoniModa-italic.ttf src/assets/fonts/Manrope.ttf src/assets/fonts/BodoniModa-OFL.txt src/assets/fonts/Manrope-OFL.txt src/assets/fonts/sources.json
          if git diff --cached --quiet; then
            echo 'Verified assets are already present; no commit needed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'build: vendor verified Bodoni Moda and Manrope fonts with OFL licenses'
          git push origin HEAD:refs/heads/fix/step-1-technical-foundation
